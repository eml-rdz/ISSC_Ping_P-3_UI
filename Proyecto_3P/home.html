<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ping - Login</title>
    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <div class="login">

        <div class="logo">
            💬 
        </div>

        <h1>Ping</h1>

        <p>Inicia sesión para continuar</p>

        <form action="home.html">

            <label>Correo electrónico</label>

            <input
                type="email"
                placeholder="ejemplo@correo.com"
                required>

            <label>Contraseña</label>

            <input
                type="password"
                placeholder="********"
                required>

            <button type="submit">
                Iniciar sesión
            </button>

        </form>

        <div class="extra">

            ¿No tienes cuenta?

            <a href="#">Regístrate</a>

        </div>

    </div>

</body>

</html>
